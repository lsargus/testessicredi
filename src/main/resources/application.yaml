spring:
  application:
    name: testesicredi

  jackson:
    time-zone: UTC

  datasource:
    url: jdbc:postgresql://localhost:5431/testescredi
    username: camara
    password: camara123
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  logging:
    level:
      org.hibernate.SQL: INFO

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-at-least-256-bits}
  expiration: 3600000
